/* ====== SONIDO PROCEDURAL 100% WEB AUDIO ====== */
class Sfx{
 constructor(){this.ctx=null;this.mGain=null;this.timer=null;this.muted=false}
 init(){ if(this.ctx) return; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.mGain=this.ctx.createGain(); this.mGain.gain.value=0.13; this.mGain.connect(this.ctx.destination);}catch(e){} }
 resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); }
 beep(f,d,type='sine',vol=0.25,slide=1){ if(this.muted||!this.ctx) return; try{ const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(this.ctx.destination); g.gain.setValueAtTime(vol,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d); if(slide!==1) o.frequency.exponentialRampToValueAtTime(f*slide,this.ctx.currentTime+d); o.start(); o.stop(this.ctx.currentTime+d);}catch(e){} }
 jump(){ this.beep(320,0.16,'square',0.28,2.1); setTimeout(()=>this.beep(680,0.12,'sine',0.2),70); }
 coin(){ [0,4,7,12].forEach((s,i)=>setTimeout(()=>this.beep(440*Math.pow(2,s/12),0.25,'triangle',0.26), i*75)); }
 fact(){ this.beep(523,0.3,'triangle',0.28); setTimeout(()=>this.beep(659,0.35,'sine',0.28),120); }
 hurt(){ this.beep(220,0.4,'sawtooth',0.32,0.55); }
 ok(){ this.beep(660,0.25,'sine',0.3,1.4); }
 bad(){ this.beep(170,0.45,'sawtooth',0.28,0.8); }
 win(){ [0,4,7,12,14].forEach((s,i)=>setTimeout(()=>this.beep(262*Math.pow(2,s/12),0.45,'square',0.24), i*130)); }
 music(lvl){
   if(this.muted||!this.ctx) return;
   this.stop();
   const mels=[[262,294,330,349,392,330,349,392],[196,247,262,294,262,247,220,196],[330,330,349,392,440,392,349,330],[262,262,294,330,392,392,440,330]];
   const mel=mels[lvl%4]; let i=0;
   const play=()=>{
     if(this.muted||!this.ctx) return;
     const freq=mel[i%mel.length]; try{
       const o=this.ctx.createOscillator(), g=this.ctx.createGain();
       o.type=lvl===1?'sine':'triangle'; o.frequency.value=freq;
       o.connect(g); g.connect(this.mGain);
       const now=this.ctx.currentTime; g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.22,now+0.05); g.gain.exponentialRampToValueAtTime(0.001,now+0.5);
       o.start(now); o.stop(now+0.55);
     }catch(e){}
     i++;
   };
   play(); this.timer=setInterval(play, 520);
 }
 stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } }
 toggle(){ this.muted=!this.muted; document.getElementById('mute').textContent=this.muted?'🔇':'🔊'; if(this.muted) this.stop(); else this.music(game?.lvlIdx||0); }
}
const SFX=new Sfx();

/* ====== UTIL PIXEL ART ====== */
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;

function drawWood(x,y,w,h){
  ctx.fillStyle="#8b5a2b"; ctx.fillRect(x,y,w,h);
  ctx.fillStyle="#a67c52"; ctx.fillRect(x,y,w,6);

  ctx.fillStyle="#1a1208"; ctx.fillRect(x+5,y+5,3,3); ctx.fillRect(x+w-10,y+5,3,3); ctx.fillRect(x+5,y+h-8,3,3); ctx.fillRect(x+w-10,y+h-8,3,3);
  ctx.fillStyle="#1a1208"; ctx.fillRect(x,y,w,2); ctx.fillRect(x,y+h-2,w,2);
}
function drawGrass(x,y,w,h){
  ctx.fillStyle="#e2c290"; ctx.fillRect(x,y,w,h);
  ctx.fillStyle="#5fbc5a"; ctx.fillRect(x,y,w,12);
  ctx.fillStyle="#3a8a3a"; ctx.fillRect(x,y+8,w,4);

}
function drawStone(x,y,w,h){

  ctx.beginPath(); ctx.moveTo(x,y+h/2); ctx.lineTo(x+w,y+h/2); ctx.stroke();
}
function drawSand(x,y,w,h){

}

/* ====== ENTIDADES ====== */
class Player{
  constructor(x,y){ this.x=x; this.y=y; this.w=26; this.h=44; this.vx=0; this.vy=0; this.dir=1; this.onGround=false; this.frame=0; this.ft=0; this.hearts=3; this.inv=0; }
  rect(){return {x:this.x,y:this.y,w:this.w,h:this.h}}
  collides(o){return this.x<o.x+o.w&&this.x+this.w>o.x&&this.y<o.y+o.h&&this.y+this.h>o.y}
  update(inp,solids,moving){
    const spd=4.1;
    if(inp.left){ this.vx=-spd; this.dir=-1; }
    else if(inp.right){ this.vx=spd; this.dir=1; }
    else { this.vx*=0.72; if(Math.abs(this.vx)<0.15) this.vx=0; }
    if(inp.jumpPressed && this.onGround){ this.vy=-13.5; this.onGround=false; SFX.jump(); spawn(this.x+13,this.y+44,8,"#d8c39a"); }
    this.vy+=0.75; if(this.vy>13) this.vy=13;

    // X
    this.x+=this.vx; this.collide(solids,true);
    // Y
    this.y+=this.vy; this.onGround=false; this.collide(solids,false);
    // moving
    for(let m of moving){
      if(this.collides(m) && this.vy>=0 && this.y+this.h - this.vy <= m.y+8){
        this.y=m.y-this.h; this.vy=0; this.onGround=true; this.x+=(m.vx||0)+(m.vy?0:0);
      }
    }
    if(this.y>1000){ this.takeHit(); this.x=game.start.x; this.y=game.start.y; this.vy=0; }

    if(Math.abs(this.vx)>0.5 && this.onGround){ this.ft++; if(this.ft>6){ this.frame=(this.frame+1)%4; this.ft=0; } }
    else if(!this.onGround) this.frame=1; else this.frame=0;
    if(this.inv>0) this.inv--;
  }
  collide(solids,horiz){
    for(let s of solids){ if(!this.collides(s)) continue;
      if(horiz){ if(this.vx>0) this.x=s.x-this.w; else if(this.vx<0) this.x=s.x+s.w; this.vx=0; }
      else{ if(this.vy>0){ this.y=s.y-this.h; this.vy=0; this.onGround=true; } else if(this.vy<0){ this.y=s.y+s.h; this.vy=0; } }
    }
  }
  takeHit(){ if(this.inv>0) return; this.hearts--; this.inv=90; SFX.hurt(); spawn(this.x+13,this.y+22,12,"#e63946");
    if(this.hearts<=0){ this.hearts=3; this.x=game.start.x; this.y=game.start.y; } }
  draw(cam){
    if(this.inv>0 && Math.floor(this.inv/6)%2===0) return;
    const x=this.x-cam.x, y=this.y-cam.y;
    const px=2;
    ctx.save();
    // sombra
    ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.fillRect(x+4,y+this.h-2,18,4);
    ctx.save();
    if(this.dir===-1){ ctx.translate(x+this.w/2,0); ctx.scale(-1,1); ctx.translate(-(x+this.w/2),0); }
    const ox=x, oy=y;
    const R=(rx,ry,rw,rh,c)=>{ ctx.fillStyle=c; ctx.fillRect(ox+rx*px, oy+ry*px, rw*px, rh*px); };
    const leg=(this.frame===1?-1:this.frame===3?1:0);
    // botas
    R(2+leg,19,3,2,"#1a1a1a"); R(8-leg,19,3,2,"#1a1a1a");
    // pantalón
    R(2,15,10,4,"#d8c39a");
    // abrigo
    R(1,7,12,8,"#b51f1f"); R(1,7,12,2,"#d64040"); R(1,12,12,2,"#7a1515");
    R(6,8,1,1,"#f2c14e"); R(6,10,1,1,"#f2c14e");
    // cara
    R(3,2,8,5,"#ffdbac");
    R(2,2,2,3,"#5d4037"); R(9,2,2,3,"#5d4037"); R(3,1,8,1,"#5d4037");
    // sombrero
    R(1,0,12,2,"#7a1515"); R(0,2,14,1,"#f2c14e"); R(0,3,14,1,"#7a1515");
    R(4,4,1,1,"#1a1a1a"); R(8,4,1,1,"#1a1a1a"); R(5,5,3,1,"#7a1515");
    // mapa mano
    R(11,8,3,4,"#fff8dc"); R(12,9,1,2,"#b51f1f");
    ctx.restore(); ctx.restore();
  }
}

let parts=[];
function spawn(x,y,n,c){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*5,vy:(Math.random()* -4 -1),life:22+Math.random()*18,col:c,sz:2+Math.random()*3}); }

/* ====== GAME CORE ====== */
class Game{
  constructor(){ this.lvlIdx=0; this.state="MENU"; this.scrolls=0; this.facts=[]; this.solids=[]; this.moving=[]; this.collects=[]; this.enemies=[]; this.goal=null; this.start={x:64,y:300}; this.cam={x:0,y:0}; this.time=0; this.player=null; }
  load(lvl){
    this.lvlIdx=lvl; this.state="STORY"; this.scrolls=0; this.facts=[]; this.solids=[]; this.moving=[]; this.collects=[]; this.enemies=[]; parts=[];
    const W=125*TILE, H=18*TILE;
    // suelo
    for(let x=0;x<125;x++){ this.solids.push({x:x*TILE,y:H-2*TILE,w:TILE,h:TILE*2,type:lvl===2?'grass':lvl===3?'stone':lvl===0?'wood':'sand'}); this.solids.push({x:x*TILE,y:H-TILE,w:TILE,h:TILE,type:lvl===2?'grass':lvl===3?'stone':'sand'}); }
    const platforms=[
      [{x:12,y:13},{x:18,y:11},{x:24,y:9},{x:32,y:11},{x:38,y:8},{x:46,y:10},{x:54,y:7},{x:62,y:9},{x:70,y:6},{x:78,y:8},{x:86,y:10},{x:94,y:7},{x:108,y:8}],
      [{x:14,y:11},{x:21,y:9},{x:28,y:10},{x:35,y:8},{x:44,y:10},{x:51,y:7},{x:60,y:9},{x:68,y:6},{x:76,y:8},{x:84,y:10},{x:92,y:8},{x:102,y:9},{x:112,y:7}],
      [{x:10,y:11},{x:16,y:9},{x:22,y:11},{x:30,y:8},{x:38,y:10},{x:46,y:6},{x:55,y:9},{x:63,y:7},{x:71,y:10},{x:80,y:8},{x:88,y:6},{x:97,y:9},{x:108,y:10}],
      [{x:11,y:11},{x:17,y:9},{x:23,y:7},{x:31,y:9},{x:37,y:6},{x:45,y:8},{x:53,y:5},{x:61,y:7},{x:69,y:4},{x:77,y:6},{x:85,y:3},{x:95,y:5},{x:106,y:7}]
    ];
    (platforms[lvl]||platforms[0]).forEach(p=>{
      let tp = lvl===2?'grass': lvl===3?'stone': lvl===0?'wood':'wood';
      if(lvl===1 && p.y>9) tp='wood'; if(lvl===2 && p.y>8) tp='grass';
      this.solids.push({x:p.x*TILE,y:p.y*TILE,w:TILE*3,h:TILE,type:tp});
    });
    if(lvl===1){
      this.moving.push({x:50*TILE,y:10*TILE,w:TILE*3,h:16,vx:0,vy:-1,minY:6*TILE,maxY:11*TILE});
      this.moving.push({x:75*TILE,y:9*TILE,w:TILE*3,h:16,vx:1.1,vy:0,minX:68*TILE,maxX:88*TILE});
    }
    const cPos=[[{x:18,y:8},{x:54,y:4},{x:94,y:4}], [{x:21,y:6},{x:60,y:6},{x:102,y:6}], [{x:16,y:6},{x:55,y:6},{x:97,y:6}], [{x:23,y:4},{x:69,y:1},{x:106,y:4}]];
    cPos[lvl].forEach((p,i)=>{ this.collects.push({x:p.x*TILE+4,y:p.y*TILE,w:22,h:28,taken:false,fact:LEVELS[lvl].facts[i]}); });
    const ePos=[[{x:30,y:13},{x:60,y:13}],[{x:35,y:7},{x:70,y:5},{x:95,y:7}],[{x:30,y:13},{x:63,y:13},{x:88,y:13}],[{x:40,y:9},{x:70,y:5}]];
    ePos[lvl].forEach(p=>{ this.enemies.push({x:p.x*TILE,y:p.y*TILE,w:28,h:24,vx:(Math.random()>0.5?1:-1)*1.2, type:lvl===1?'gull':'crab', t:Math.random()*100}); });
    this.goal={x:118*TILE,y:H-5*TILE,w:68,h:80};
    this.start={x:2*TILE,y:H-5*TILE-20};
    this.player=new Player(this.start.x,this.start.y);
    this.cam={x:0,y:0}; this.time=0;
    SFX.music(lvl);
    showStory();
    document.getElementById('hud').style.display='flex';
  }
  update(inp){
    if(this.state!=="PLAY") return;
    this.time++;
    this.player.update(inp,this.solids,this.moving);
    for(let m of this.moving){
      if(m.minY!==undefined){ m.y+=m.vy; if(m.y<m.minY||m.y>m.maxY) m.vy*=-1; }
      if(m.minX!==undefined){ m.x+=m.vx; if(m.x<m.minX||m.x>m.maxX) m.vx*=-1; }
    }
    for(let e of this.enemies){
      e.t+=0.08; e.x+=e.vx; if(e.type==='gull') e.y+=Math.sin(this.time*0.05+e.t)*0.7;
      if(e.x<0||e.x>125*TILE) e.vx*=-1;
      if(this.player.collides(e) && this.player.inv===0){ this.player.takeHit(); this.player.vy=-8; this.player.vx= e.x<this.player.x?4:-4; }
    }
    for(let c of this.collects){ if(!c.taken && this.player.collides(c)){ c.taken=true; this.scrolls++; this.facts.push(c.fact); SFX.coin(); spawn(c.x+10,c.y+10,14,"#f2c14e"); showFact(c.fact); } }
    if(this.player.x+this.player.w > this.goal.x){
      this.state="QUIZ"; SFX.win(); showQuiz();
    }
    this.cam.x += (this.player.x - this.cam.x - 480 +13)*0.09;
    this.cam.y += (this.player.y - this.cam.y - 270)*0.09;
    this.cam.x=Math.max(0,Math.min(this.cam.x,125*TILE-960));
    this.cam.y=Math.max(-80,Math.min(this.cam.y,18*TILE-540+60));
    for(let p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life--; } parts=parts.filter(p=>p.life>0);
    // HUD
    document.getElementById('hudHearts').innerHTML=`<span style="font-family:'Press Start 2P';font-size:9px">VIDA</span>`+Array(this.player.hearts).fill(0).map(()=>' <span class="heart"></span>').join('')+` x${this.player.hearts}`;
    document.getElementById('hudScrolls').innerHTML=`<span style="font-family:'Press Start 2P';font-size:9px">MAPAS</span> <span class="scrollIcon">📜</span> <b>${this.scrolls}/3</b> <span style="font-size:16px;opacity:.8">| ${LEVELS[this.lvlIdx].name}</span>`;
  }
  draw(){
    const lvl=LEVELS[this.lvlIdx]; if(!lvl) return;
    // cielo degradado
    let g=ctx.createLinearGradient(0,0,0,540);
    if(this.lvlIdx===0){ g.addColorStop(0,"#f7c98e"); g.addColorStop(0.5,"#f6d88a"); g.addColorStop(1,"#6bbfef"); }
    else if(this.lvlIdx===1){ g.addColorStop(0,"#0f1e3a"); g.addColorStop(0.4,"#274a7c"); g.addColorStop(1,"#4a9cdb"); }
    else if(this.lvlIdx===2){ g.addColorStop(0,"#74d2f0"); g.addColorStop(1,"#97e57a"); }
    else { g.addColorStop(0,"#d9c89d"); g.addColorStop(1,"#8d6e3e"); }
    ctx.fillStyle=g; ctx.fillRect(0,0,960,540);

    // estrellas / ondas
    if(this.lvlIdx===1){
      ctx.fillStyle="#fff8dc"; for(let i=0;i<40;i++){ const sx=(i*197+this.time*0.1)%960, sy=(i*97)%180; ctx.fillRect(sx,sy,2,2); }
      ctx.fillStyle="#fff8dc"; ctx.fillRect(780-this.cam.x*0.05,45,36,36); ctx.fillStyle="#e5d9a0"; ctx.fillRect(790-this.cam.x*0.05,55,8,8);
    }
    // nubes parallax simples
    ctx.fillStyle="rgba(255,255,255,0.9)";
    for(let i=0;i<8;i++){ const nx=(i*400 + this.time*0.2)% (4000) - this.cam.x*0.3; const ny=40 + i*35; if(nx>-120&&nx<1000){ ctx.fillRect(nx,ny,80,14); ctx.fillRect(nx+12,ny-8,52,12); } }

    // tiles
    for(let s of this.solids){
      const x=s.x-this.cam.x, y=s.y-this.cam.y; if(x<-64||x>1020||y<-64||y>600) continue;
      if(s.type==='wood') drawWood(x,y,s.w,s.h);
      else if(s.type==='grass') drawGrass(x,y,s.w,s.h);
      else if(s.type==='stone') drawStone(x,y,s.w,s.h);
      else drawSand(x,y,s.w,s.h);
    }
    for(let m of this.moving){ const x=m.x-this.cam.x, y=m.y-this.cam.y; drawWood(x,y,m.w,m.h); }

    drawGoal(this.goal.x-this.cam.x, this.goal.y-this.cam.y, this.lvlIdx);

    for(let c of this.collects){ if(c.taken) continue; drawScrollIcon(c.x-this.cam.x, c.y-this.cam.y, this.time*0.07 + c.x*0.01); }
    for(let e of this.enemies){ const x=e.x-this.cam.x, y=e.y-this.cam.y; if(e.type==='gull') drawGull(x,y,this.time+e.t); else drawCrab(x,y,this.time+e.t); }

    this.player.draw(this.cam);

    for(let p of parts){ ctx.globalAlpha=p.life/30; ctx.fillStyle=p.col; ctx.fillRect(p.x-this.cam.x, p.y-this.cam.y, p.sz, p.sz); ctx.globalAlpha=1; }
  }
}

let game; let inp={left:false,right:false,jump:false,jumpPressed:false};
function showMenu(){
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML=`
  <div class="pixel-card">
    <h1 style="text-align:center">⛵ LA GRAN AVENTURA DE COLÓN 🌎</h1>
    <div style="text-align:center; font-size:32px; margin:6px 0">🗺️ ⚓ 👑</div>
    <p style="text-align:center"><span class="badge">📚 Educativo</span> <span class="badge">🎮 Plataformas</span> <span class="badge">🔊 Sonido Retro</span></p>
    <p>¡Conviértete en Cristóbal Colón! 4 niveles con historia real para niños exploradores.</p>
    <p>🎯 <b>Misión:</b> Salta, recoge 3 pergaminos 📜 por nivel y aprende historia jugando.</p>
    <p style="font-family:'Press Start 2P'; font-size:8px; line-height:1.5; background:#1a1208; color:#fff8dc; padding:8px; border:3px solid #f2c14e">CONTROLES: ⬅️➡️ MOVER | ESPACIO / ⬆️ SALTAR | 📜 PERGAMINOS = DATOS REALES</p>
    <div style="text-align:center; margin-top:10px">
      <button class="btn yellow" id="start">¡COMENZAR AVENTURA!</button>
      <button class="btn blue" id="how">¿CÓMO JUGAR?</button>
    </div>
    <p style="font-size:15px; opacity:.7; text-align:center; margin-top:8px">Pixel-art 2D · Hecho para niños · Sin violencia · 1492-1493</p>
  </div>`;
  document.getElementById('start').onclick=()=>{ SFX.init(); SFX.resume(); if(!game) game=new Game(); game.load(0); ov.style.display='none'; game.state="PLAY"; document.getElementById('hud').style.display='flex'; };
  document.getElementById('how').onclick=()=>showHow();
  game={lvlIdx:0, state:"MENU", draw:()=>{ // preview draw for menu
    let g=ctx.createLinearGradient(0,0,0,540); g.addColorStop(0,"#f6c28b"); g.addColorStop(1,"#5eb0df"); ctx.fillStyle=g; ctx.fillRect(0,0,960,540);
    ctx.fillStyle="rgba(255,255,255,0.9)"; for(let i=0;i<6;i++){ ctx.fillRect((i*200+(Date.now()*0.05)%200)-20, 40+i*22, 80,12); }
    ctx.fillStyle="#8b5a2b"; for(let i=0;i<12;i++) ctx.fillRect(i*80- (Date.now()*0.03)%80, 420, 70,120);
  }};
}
function showHow(){
  document.getElementById('overlay').innerHTML=`
  <div class="pixel-card">
    <h1>CÓMO JUGAR</h1>
    <p>👦 Eres el joven Colón. Salta plataformas de madera, piedra y arena.</p>
    <p>📜 Cada pergamino te enseña un dato real de 1492.</p>
    <p>❤️ Si te toca una gaviota o cangrejo, pierdes una vida pero ¡sigues explorando!</p>
    <p>🏁 Llega al barco final para responder un quiz divertido.</p>
    <p>🎓 ¡Aprenderás fechas, nombres y el respeto por culturas!</p>
    <button class="btn green" id="back">¡ENTENDIDO!</button>
  </div>`;
  document.getElementById('back').onclick=showMenu;
}
function showStory(){
  const d=LEVELS[game.lvlIdx];
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML=`
  <div class="pixel-card">
    <div style="display:flex; gap:6px; margin-bottom:8px">${[0,1,2,3].map(i=>`<div style="width:18px;height:18px;border:3px solid #1a1208;background:${i<game.lvlIdx?'#2e8b57':i===game.lvlIdx?'#f2c14e':'#fff'}"></div>`).join('')}</div>
    <h1>${d.title}</h1>
    <h2>${d.name}</h2>
    <p>${d.story}</p>
    <p style="background:#fff; border:3px dashed #1a1208; padding:8px"><b>🎯 MISIÓN:</b> ${d.goal}</p>
    <p>💡 Sabías que... ${d.facts[0]}</p>
    <button class="btn green" id="go">¡A LA AVENTURA! ⛵</button>
  </div>`;
  document.getElementById('go').onclick=()=>{ ov.style.display='none'; game.state="PLAY"; };
}
function showFact(txt){
  game.state="PAUSE_FACT";
  const div=document.createElement('div');
  div.style.cssText=`position:absolute; left:50%; top:18%; transform:translateX(-50%); z-index:30; max-width:520px; width:90%`;
  div.innerHTML=`<div class="pixel-card" style="border-color:#2a7bd4; box-shadow:8px 8px 0 #1a1208">
    <h1 style="font-size:12px; color:#2a7bd4">¡DESCUBRIMIENTO! 📜</h1><p style="font-size:21px">${txt}</p><button class="btn yellow" style="font-size:9px">¡GENIAL!</button>
  </div>`;
  document.getElementById('gameWrapper').appendChild(div);
  SFX.fact();
  const close=()=>{ div.remove(); if(game.state==="PAUSE_FACT") game.state="PLAY"; };
  div.querySelector('button').onclick=close;
  setTimeout(close, 4000);
}
function showQuiz(){
  const d=LEVELS[game.lvlIdx]; let qi=0, ok=0;
  const ov=document.getElementById('overlay');
  function render(){
    const q=d.quiz[qi];
    ov.innerHTML=`
    <div class="pixel-card">
      <h1>🧠 PRUEBA DE EXPLORADOR</h1>
      <p>Mapas ${game.scrolls}/3 | Aciertos ${ok}/${qi}</p>
      <div style="background:#1a1208;color:#fff8dc;padding:10px;border:4px solid #f2c14e"><p style="font-family:'Press Start 2P';font-size:11px;line-height:1.5">${q.q}</p></div>
      <div>${q.a.map((o,i)=>`<div class="opt" data-i="${i}" style="border:3px solid #1a1208;padding:10px;margin:8px 0;background:#fff;cursor:pointer;font-size:20px">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div>
    </div>`;
    ov.style.display='flex';
    ov.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      const c=parseInt(el.dataset.i);
      if(c===q.c){ el.style.background="#8ee4af"; el.style.borderColor="#2e8b57"; SFX.ok(); ok++; qi++; if(qi>=d.quiz.length) setTimeout(()=>showComplete(ok),600); else setTimeout(render,700); }
      else{ el.style.background="#ff9a9a"; SFX.bad(); }
    });
  }
  render();
}
function showComplete(ok){
  const last=game.lvlIdx===LEVELS.length-1;
  const ov=document.getElementById('overlay');
  ov.innerHTML=`
  <div class="pixel-card" style="text-align:center">
    <h1>${last?'¡LEYENDA! 🏆':'¡NIVEL SUPERADO! 🎉'}</h1>
    <p style="font-size:28px">Mapas ${game.scrolls}/3 | Quiz ${ok}/3</p>
    <div style="font-size:40px;margin:8px">⭐⭐⭐</div>
    <p>${LEVELS[game.lvlIdx].facts.slice(1,3).join('<br>')}</p>
    ${last?`<div style="background:#fff;border:3px solid #1a1208;padding:10px;margin:10px"><p style="font-family:'Press Start 2P';font-size:8px;line-height:1.6">📜 DIPLOMA OFICIAL<br>EXPLORADOR VALIENTE<br>Nombre: ¡TÚ!<br>Fecha: 12 Oct 1492<br>Firmado: Reyes Católicos</p></div>`:`<p>¿Listo para el siguiente?</p>`}
    <button class="btn ${last?'yellow':'blue'}" id="next">${last?'JUGAR DE NUEVO 🔄':'SIGUIENTE ➡️'}</button>
  </div>`;
  ov.style.display='flex';
  document.getElementById('next').onclick=()=>{
    if(last) game.load(0); else game.load(game.lvlIdx+1);
    ov.style.display='none'; game.state="PLAY";
  };
}

/* INPUT */
window.addEventListener('keydown',e=>{
  if(["ArrowLeft","a","A"].includes(e.key)) inp.left=true;
  if(["ArrowRight","d","D"].includes(e.key)) inp.right=true;
  if([" ","ArrowUp","w","W"].includes(e.key)){ if(!inp.jump) inp.jumpPressed=true; inp.jump=true; }
});
window.addEventListener('keyup',e=>{
  if(["ArrowLeft","a","A"].includes(e.key)) inp.left=false;
  if(["ArrowRight","d","D"].includes(e.key)) inp.right=false;
  if([" ","ArrowUp","w","W"].includes(e.key)) inp.jump=false;
});
function bind(id,k){
  const el=document.getElementById(id);
  const set=v=>{ inp[k]=v; if(k==='jump'&&v) inp.jumpPressed=true; if(v){ SFX.init(); SFX.resume(); } };
  el.addEventListener('touchstart',e=>{e.preventDefault(); set(true);},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault(); set(false);},{passive:false});
  el.addEventListener('mousedown',()=>set(true)); el.addEventListener('mouseup',()=>set(false)); el.addEventListener('mouseleave',()=>set(false));
}
bind('bL','left'); bind('bR','right'); bind('bJ','jump');

/* LOOP */
function loop(){
  requestAnimationFrame(loop);
  try{
    if(game && game.update) game.update(inp);
    if(game && game.draw) game.draw();
    if(inp.jumpPressed) inp.jumpPressed=false;
  }catch(err){
    document.getElementById('debug').textContent="Error: "+err.message;
    console.error(err);
  }
}
window.addEventListener('load',()=>{ SFX.init(); game=new Game(); loop(); showMenu(); });
document.getElementById('mute').onclick=()=>SFX.toggle();

// fallback si fonts no cargan 1 seg
setTimeout(()=>{ if(!game) { game=new Game(); loop(); showMenu(); } }, 1200);
</script>
